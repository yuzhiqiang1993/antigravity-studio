name: Build & Release Multiplatform Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 1.2.3，必须与 gradle.properties 一致)'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. 验证版本一致性、运行质量门禁并创建 Draft Release
  # --------------------------------------------------------------------------
  init-release:
    name: Validate & Initialize Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine & Verify Version
        id: vars
        run: |
          chmod +x gradlew
          PROP_VERSION=$(awk -F= '$1 ~ /^[[:space:]]*app\.version[[:space:]]*$/ {gsub(/^[[:space:]]*|[[:space:]]*$/, "", $2); print $2; exit}' gradle.properties)
          echo "gradle.properties version: $PROP_VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            TAG_NAME="v$INPUT_VER"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(v.+) ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"
          else
            TAG_NAME="v$PROP_VERSION"
          fi

          VERSION="${TAG_NAME#v}"
          if [ "$VERSION" != "$PROP_VERSION" ]; then
            echo "::error::Tag 版本 ($VERSION) 与 gradle.properties 中的 app.version ($PROP_VERSION) 不一致！"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Quality Gate Tests
        run: ./gradlew :shared:jvmTest :desktopApp:compileKotlin

      - name: Extract Release Notes from CHANGELOG
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          if [ -f "CHANGELOG.md" ]; then
            awk -v ver="$VERSION" '
              BEGIN { found=0; }
              $0 ~ "^## \\[" ver "\\]" { found=1; next; }
              found && /^## \[/ { exit; }
              found { print; }
            ' CHANGELOG.md > RELEASE_BODY.md
          fi
          
          if [ -s RELEASE_BODY.md ]; then
            cat RELEASE_BODY.md > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "---" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "### 📦 下载指引" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "- **macOS Apple Silicon（M 系列芯片）**：下载 \`Antigravity-Studio-$VERSION-macos-arm64.dmg\`" >> RELEASE_NOTES.md
            echo "- **macOS Intel 芯片**：下载 \`Antigravity-Studio-$VERSION-macos-x64.dmg\`" >> RELEASE_NOTES.md
            echo "- **Windows 64 位**：下载 \`Antigravity-Studio-$VERSION-windows-x64.exe\`" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "> ⚠️ **macOS 用户注意**：首次安装后如果提示\"已损坏\"或\"无法打开\"，请在终端执行以下命令解除系统的 Gatekeeper 隔离限制：" >> RELEASE_NOTES.md
            echo "> \`\`\`bash" >> RELEASE_NOTES.md
            echo "> sudo xattr -rd com.apple.quarantine \"/Applications/Antigravity Studio.app\"" >> RELEASE_NOTES.md
            echo "> \`\`\`" >> RELEASE_NOTES.md
          else
            echo "Antigravity Studio $VERSION 正式发布。" > RELEASE_NOTES.md
          fi

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Antigravity Studio ${{ steps.vars.outputs.tag_name }}"
          draft: true
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 2. 矩阵构建各平台安装包、生成 SHA-256 / Ed25519 签名 Sidecar 并上传
  # --------------------------------------------------------------------------
  build-and-upload:
    name: Build & Upload (${{ matrix.os_label }})
    needs: init-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            os_label: macOS-AppleSilicon-arm64
            platform: macos
            arch: arm64
            jdk_arch: aarch64
            formats: dmg

          - os: macos-14
            os_label: macOS-Intel-x64
            platform: macos
            arch: x64
            jdk_arch: x64
            formats: dmg

          - os: windows-latest
            os_label: Windows-x64
            platform: windows
            arch: x64
            jdk_arch: x64
            formats: exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (${{ matrix.jdk_arch }})
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: ${{ matrix.jdk_arch }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for scripts (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x gradlew
          chmod +x app_build.sh

      # macOS 构建与打包 (DMG)
      - name: Build and Package Desktop App (Unix)
        if: runner.os != 'Windows'
        run: |
          ./app_build.sh build --build-type release --formats dmg

      # Windows 构建与打包 (EXE)
      - name: Build and Package Desktop App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:packageExe -PbuildType=release

      # 整理产物并生成 Manifest 与 Ed25519 签名 (Unix)
      - name: Generate Manifest & Sign Artifacts (Unix)
        if: runner.os != 'Windows'
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p release-artifacts
          VERSION="${{ needs.init-release.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          ASSET_NAME="Antigravity-Studio-$VERSION-macos-$ARCH.dmg"
          SRC_DMG="desktopApp/build/compose/binaries/main/dmg/Antigravity Studio-$VERSION.dmg"

          if [ ! -f "$SRC_DMG" ]; then
            echo "::error::构建产物 $SRC_DMG 未找到！"
            exit 1
          fi

          DEST_DMG="release-artifacts/$ASSET_NAME"
          cp "$SRC_DMG" "$DEST_DMG"

          FILE_SIZE=$(wc -c < "$DEST_DMG" | tr -d ' ')
          FILE_SHA=$(shasum -a 256 "$DEST_DMG" | awk '{print $1}')
          MANIFEST_FILE="release-artifacts/${ASSET_NAME}.manifest.json"
          SIG_FILE="release-artifacts/${ASSET_NAME}.manifest.json.sig"

          cat <<EOF > "$MANIFEST_FILE"
          {"version":"$VERSION","assetName":"$ASSET_NAME","sha256":"$FILE_SHA","size":$FILE_SIZE}
          EOF

          if [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ]; then
            java scripts/SignUpdateArtifact.java "$MANIFEST_FILE" "$SIG_FILE"
          else
            echo "::warning::缺少 UPDATE_SIGNING_PRIVATE_KEY secret，跳过安装包安全签名生成！"
          fi

      # 整理产物并生成 Manifest 与 Ed25519 签名 (Windows)
      - name: Generate Manifest & Sign Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $version = "${{ needs.init-release.outputs.version }}"
          $assetName = "Antigravity-Studio-$version-windows-x64.exe"
          $srcExe = "desktopApp/build/compose/binaries/main/exe/Antigravity Studio-$version.exe"

          if (-not (Test-Path $srcExe)) {
            Write-Error "构建产物 $srcExe 未找到！"
            exit 1
          }

          $destExe = "release-artifacts/$assetName"
          Copy-Item $srcExe $destExe

          $fileSize = (Get-Item $destExe).Length
          $fileSha = (Get-FileHash -Algorithm SHA256 $destExe).Hash.ToLower()
          $manifestFile = "release-artifacts/$assetName.manifest.json"
          $sigFile = "release-artifacts/$assetName.manifest.json.sig"

          $manifestJson = "{`"version`":`"$version`",`"assetName`":`"$assetName`",`"sha256`":`"$fileSha`",`"size`":$fileSize}"
          Set-Content -Path $manifestFile -Value $manifestJson -NoNewline

          if (-not [string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY)) {
            java scripts/SignUpdateArtifact.java $manifestFile $sigFile
          } else {
            Write-Warning "缺少 UPDATE_SIGNING_PRIVATE_KEY secret，跳过安装包安全签名生成！"
          }

      - name: Upload Assets & Signatures to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 3. 最终发布：所有矩阵产物全部上传并验证后，将 Release 由 Draft 改为 Published
  # --------------------------------------------------------------------------
  publish-release:
    name: Finalize & Publish Release
    needs: [init-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
