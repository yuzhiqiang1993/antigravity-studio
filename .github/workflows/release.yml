name: Build & Release Multiplatform Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 1.0.0，不填则默认读取工程配置)'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 矩阵构建多平台与各 CPU 架构安装包
  # --------------------------------------------------------------------------
  build-packages:
    name: Build (${{ matrix.os_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4 系列芯片原生 DMG)
          - os: macos-14
            os_label: macOS-AppleSilicon-arm64
            platform: macos
            arch: arm64
            jdk_arch: aarch64
            formats: dmg

          # macOS Intel (在 macos-14 上通过 x64 JDK 原生构建 Intel DMG)
          - os: macos-14
            os_label: macOS-Intel-x64
            platform: macos
            arch: x64
            jdk_arch: x64
            formats: dmg

          # Windows x64 (原生 EXE 安装器)
          - os: windows-latest
            os_label: Windows-x64
            platform: windows
            arch: x64
            jdk_arch: x64
            formats: exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (${{ matrix.jdk_arch }})
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: ${{ matrix.jdk_arch }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for scripts (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x gradlew
          chmod +x app_build.sh

      # macOS 构建与打包 (只打 DMG)
      - name: Build and Package Desktop App (Unix)
        if: runner.os != 'Windows'
        run: |
          ./app_build.sh build --build-type release --formats dmg

      # Windows 构建与打包 (只打 EXE)
      - name: Build and Package Desktop App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew :desktopApp:packageExe -PbuildType=release

      # 规范化重命名与整理产物 (Unix)
      - name: Organize & Normalize Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-artifacts
          VERSION=$(./app_build.sh help | head -n 1 > /dev/null; grep 'packageVersion\s*=' desktopApp/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          ARCH="${{ matrix.arch }}"
          
          # DMG 推荐安装包
          if [ -f "desktopApp/build/compose/binaries/main/dmg/Antigravity Studio-$VERSION.dmg" ]; then
            cp "desktopApp/build/compose/binaries/main/dmg/Antigravity Studio-$VERSION.dmg" "release-artifacts/Antigravity-Studio-$VERSION-macos-$ARCH.dmg"
          fi

      # 规范化重命名与整理产物 (Windows)
      - name: Organize & Normalize Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $gradleContent = Get-Content "desktopApp/build.gradle.kts" -Raw
          $versionMatch = [regex]::Match($gradleContent, 'packageVersion\s*=\s*"([^"]+)"')
          $version = if ($versionMatch.Success) { $versionMatch.Groups[1].Value } else { "1.0.0" }
          
          # EXE 推荐安装包
          if (Test-Path "desktopApp/build/compose/binaries/main/exe/Antigravity Studio-$version.exe") {
            Copy-Item "desktopApp/build/compose/binaries/main/exe/Antigravity Studio-$version.exe" "release-artifacts/Antigravity-Studio-$version-windows-x64.exe"
          }

      # 上传当前 Job 产物作为 Workflow Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os_label }}
          path: release-artifacts/*
          retention-days: 7

  # --------------------------------------------------------------------------
  # 汇总所有平台安装包并创建/更新 GitHub Release
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Flatten & Collect Release Assets
        run: |
          mkdir -p dist
          find all-artifacts -type f -exec cp {} dist/ \;
          echo "=== 待发布的安装包与校验文件 ==="
          ls -lh dist/
          
          # 生成统一的 CHECKSUMS.txt
          cd dist
          rm -f CHECKSUMS.txt
          sha256sum * > CHECKSUMS.txt || true

      - name: Determine Tag and Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(v.+) ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"
          else
            VERSION=$(grep 'packageVersion\s*=' desktopApp/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG_NAME="v$VERSION"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          echo "正在提取版本 $VERSION 的更新日志..."
          
          # 从 CHANGELOG.md 提取当前版本段落
          if [ -f "CHANGELOG.md" ]; then
            awk -v ver="$VERSION" '
              BEGIN { found=0; }
              $0 ~ "^## \\[" ver "\\]" { found=1; next; }
              found && /^## \[/ { exit; }
              found { print; }
            ' CHANGELOG.md > RELEASE_BODY.md
          fi
          
          if [ -s RELEASE_BODY.md ]; then
            cat RELEASE_BODY.md > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "---" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "### 📦 下载指引" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "- **macOS Apple Silicon（M 系列芯片）**：下载 \`Antigravity-Studio-$VERSION-macos-arm64.dmg\`" >> RELEASE_NOTES.md
            echo "- **macOS Intel 芯片**：下载 \`Antigravity-Studio-$VERSION-macos-x64.dmg\`" >> RELEASE_NOTES.md
            echo "- **Windows 64 位**：下载 \`Antigravity-Studio-$VERSION-windows-x64.exe\`" >> RELEASE_NOTES.md
            echo "- **完整性校验**：下载 \`CHECKSUMS.txt\` 进行 SHA-256 哈希比对" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "> ⚠️ **macOS 用户注意**：首次安装后如果提示\"已损坏\"或\"无法打开\"，请在终端执行以下命令解除系统的 Gatekeeper 隔离限制：" >> RELEASE_NOTES.md
            echo "> \`\`\`bash" >> RELEASE_NOTES.md
            echo "> sudo xattr -rd com.apple.quarantine \"/Applications/Antigravity Studio.app\"" >> RELEASE_NOTES.md
            echo "> \`\`\`" >> RELEASE_NOTES.md
          else
            echo "Antigravity Studio $VERSION 正式发布。" > RELEASE_NOTES.md
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Antigravity Studio ${{ steps.vars.outputs.tag_name }}"
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
